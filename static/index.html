<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG Remover — AI Background Removal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0f;
    --surface: #141418;
    --border: #242428;
    --border-bright: #3a3a42;
    --text: #e8e8ec;
    --muted: #5a5a68;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.12);
    --accent-glow: rgba(0,229,160,0.25);
    --danger: #ff4757;
    --warn: #ffa502;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    /* Subtle grid pattern */
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    background: rgba(12,12,15,0.95);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: grid;
    place-items: center;
  }

  .logo-mark svg { width: 16px; height: 16px; }

  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--text);
  }

  .logo-text span { color: var(--accent); }

  .header-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 8px;
    border-radius: 2px;
    letter-spacing: 0.1em;
  }

  /* ── Status Bar ── */
  #statusBar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  #statusDot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  #statusDot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  #statusDot.error  { background: var(--danger); }

  /* ── Main ── */
  main {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 24px;
  }

  .workspace {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── Panel ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .panel-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .panel-body { padding: 24px; }

  /* ── Drop Zone ── */
  #dropZone {
    border: 1.5px dashed var(--border-bright);
    border-radius: 4px;
    padding: 72px 40px;
    text-align: center;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s, background 0.2s;
    background: rgba(255,255,255,0.01);
  }

  #dropZone:hover, #dropZone.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  #dropZone input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
    z-index: 5;
  }

  .drop-icon {
    width: 56px; height: 56px;
    margin: 0 auto 20px;
    border: 1.5px solid var(--border-bright);
    border-radius: 8px;
    display: grid;
    place-items: center;
    transition: border-color 0.2s, background 0.2s;
  }

  #dropZone:hover .drop-icon,
  #dropZone.drag-over .drop-icon {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .drop-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.06em;
    color: var(--text);
    margin-bottom: 6px;
  }

  .drop-sub {
    font-size: 13px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── Batch List ── */
  #batchList {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .batch-item {
    display: grid;
    grid-template-columns: 48px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 3px;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .batch-thumb {
    width: 48px; height: 48px;
    border-radius: 3px;
    object-fit: cover;
    border: 1px solid var(--border);
    background: var(--border);
  }

  .batch-info { overflow: hidden; }

  .batch-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .batch-size {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .batch-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 2px;
    white-space: nowrap;
    min-width: 90px;
    text-align: center;
  }

  .status-waiting  { background: rgba(90,90,104,0.2); color: var(--muted); }
  .status-processing { background: rgba(255,165,2,0.15); color: var(--warn); }
  .status-done     { background: rgba(0,229,160,0.12); color: var(--accent); }
  .status-error    { background: rgba(255,71,87,0.12); color: var(--danger); }

  .batch-download {
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .batch-download:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .batch-download:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ── Progress Bar ── */
  .progress-wrap {
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
    margin-top: 6px;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* ── Action Bar ── */
  .action-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .action-info {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 10px 24px;
    border-radius: 3px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
    font-weight: 600;
  }

  .btn-primary:hover:not(:disabled) {
    background: #00ffb3;
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-ghost {
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--muted);
  }

  .btn-ghost:hover { border-color: var(--text); color: var(--text); }

  /* ── Results Grid ── */
  #resultsGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-preview {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    background-color: #1a1a20;
    background-image:
      linear-gradient(45deg, #222228 25%, transparent 25%),
      linear-gradient(-45deg, #222228 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #222228 75%),
      linear-gradient(-45deg, transparent 75%, #222228 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    overflow: hidden;
  }

  .result-preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .result-footer {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .result-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .result-dl {
    background: var(--accent-dim);
    border: 1px solid rgba(0,229,160,0.3);
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .result-dl:hover {
    background: var(--accent);
    color: #000;
  }

  /* ── Error Banner ── */
  #errorBanner {
    background: rgba(255,71,87,0.08);
    border: 1px solid rgba(255,71,87,0.3);
    border-radius: 3px;
    padding: 12px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--danger);
    display: none;
    align-items: center;
    gap: 10px;
  }

  /* ── Spinner ── */
  .spin {
    width: 14px; height: 14px;
    border: 2px solid transparent;
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    main { padding: 24px 12px; }
    header { padding: 0 16px; }
    .panel-body { padding: 16px; }
    #dropZone { padding: 48px 20px; }
    .batch-item { grid-template-columns: 40px 1fr auto; }
    .batch-download { display: none; }
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 16 16" fill="none">
        <rect x="2" y="2" width="12" height="12" rx="2" stroke="#000" stroke-width="1.5"/>
        <path d="M5 8.5C5 7 6.5 5.5 8 5.5C9.5 5.5 11 7 11 8.5C11 10 9.5 11.5 8 11.5" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="logo-text">BG<span>.</span>REMOVER</span>
  </div>
  <div class="header-badge">LOCAL · FREE · PRIVATE</div>
</header>

<!-- Status Bar -->
<div id="statusBar">
  <div id="statusDot"></div>
  <span id="statusText">Checking server…</span>
</div>

<!-- Main -->
<main>
  <div class="workspace">

    <!-- Error Banner -->
    <div id="errorBanner">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 018 4zm0 8a1 1 0 110-2 1 1 0 010 2z"/></svg>
      <span id="errorText"></span>
    </div>

    <!-- Upload Panel -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">// Upload Images</span>
        <span class="panel-title" id="fileCount">0 files queued</span>
      </div>
      <div class="panel-body">
        <div id="dropZone">
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple>
          <div class="drop-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="drop-title">Drop images here</div>
          <div class="drop-sub">JPG · PNG · WEBP &nbsp;|&nbsp; Max 15MB each &nbsp;|&nbsp; Batch supported</div>
        </div>

        <!-- Batch List -->
        <div id="batchList" style="margin-top:16px; display:none;"></div>

        <!-- Progress -->
        <div id="progressWrap" class="progress-wrap" style="margin-top:16px; display:none;">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <span class="action-info" id="actionInfo">Select images to get started.</span>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" id="clearBtn" style="display:none;" onclick="clearAll()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
          Clear
        </button>
        <button class="btn btn-primary" id="processBtn" disabled onclick="processAll()">
          <span id="processBtnIcon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </span>
          <span id="processBtnText">Remove Backgrounds</span>
        </button>
      </div>
    </div>

    <!-- Results Panel -->
    <div class="panel" id="resultsPanel" style="display:none;">
      <div class="panel-header">
        <span class="panel-title">// Results</span>
        <button class="btn btn-ghost" style="padding:4px 12px; font-size:10px;" onclick="downloadAll()">
          Download All
        </button>
      </div>
      <div class="panel-body">
        <div id="resultsGrid"></div>
      </div>
    </div>

  </div>
</main>

<footer>
  <span>Powered by rembg + u2net_human_seg &nbsp;·&nbsp; FastAPI backend</span>
  <span>100% local · no data leaves your machine</span>
</footer>

<script>
  const API = '';  // same origin

  // ── State ────────────────────────────────────────────────────────────────
  let files = [];        // { file, name, size, thumbUrl, status, downloadUrl }
  let processing = false;

  // ── Server Health Check ──────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch(`${API}/health`);
      if (r.ok) {
        setStatus('online', 'Server online · Model loaded · Ready to process');
      } else {
        setStatus('error', 'Server error — check your terminal');
      }
    } catch {
      setStatus('error', 'Cannot reach server · Run: python app.py');
    }
  }

  function setStatus(state, text) {
    document.getElementById('statusDot').className = state;
    document.getElementById('statusText').textContent = text;
  }

  checkHealth();
  setInterval(checkHealth, 15000);

  // ── File Input ────────────────────────────────────────────────────────────
  const dropZone  = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  ['dragenter','dragover'].forEach(e => dropZone.addEventListener(e, ev => {
    ev.preventDefault(); dropZone.classList.add('drag-over');
  }));
  ['dragleave','drop'].forEach(e => dropZone.addEventListener(e, ev => {
    ev.preventDefault(); dropZone.classList.remove('drag-over');
  }));
  dropZone.addEventListener('drop', e => addFiles(e.dataTransfer.files));
  fileInput.addEventListener('change', () => addFiles(fileInput.files));

  function addFiles(fileList) {
    for (const f of fileList) {
      if (!f.type.startsWith('image/')) continue;
      if (f.size > 15 * 1024 * 1024) { showError(`${f.name} exceeds 15MB limit.`); continue; }
      files.push({ file: f, name: f.name, size: f.size, thumbUrl: URL.createObjectURL(f), status: 'waiting', downloadUrl: null });
    }
    renderBatch();
    fileInput.value = '';
  }

  // ── Render Batch List ────────────────────────────────────────────────────
  function renderBatch() {
    const list = document.getElementById('batchList');
    const fc   = document.getElementById('fileCount');
    const pb   = document.getElementById('processBtn');
    const cb   = document.getElementById('clearBtn');
    const info = document.getElementById('actionInfo');

    fc.textContent = `${files.length} file${files.length !== 1 ? 's' : ''} queued`;

    if (files.length === 0) {
      list.style.display = 'none';
      pb.disabled = true;
      cb.style.display = 'none';
      info.textContent = 'Select images to get started.';
      return;
    }

    list.style.display = 'flex';
    cb.style.display = 'inline-flex';
    pb.disabled = processing;
    info.textContent = `${files.length} image${files.length !== 1 ? 's' : ''} ready · Uses u2net_human_seg model`;

    list.innerHTML = files.map((f, i) => `
      <div class="batch-item" id="item-${i}">
        <img class="batch-thumb" src="${f.thumbUrl}" alt="">
        <div class="batch-info">
          <div class="batch-name">${f.name}</div>
          <div class="batch-size">${(f.size / 1024).toFixed(0)} KB</div>
        </div>
        <span class="batch-status status-${f.status}">${statusLabel(f.status)}</span>
        <button class="batch-download" onclick="downloadSingle(${i})" ${f.downloadUrl ? '' : 'disabled'}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Save PNG
        </button>
      </div>
    `).join('');
  }

  function statusLabel(s) {
    return { waiting: '⬤ WAITING', processing: '⬤ PROCESSING…', done: '⬤ DONE', error: '⬤ ERROR' }[s] || s;
  }

  // ── Process All ──────────────────────────────────────────────────────────
  async function processAll() {
    if (processing || files.length === 0) return;
    processing = true;
    hideError();

    document.getElementById('processBtn').disabled = true;
    document.getElementById('processBtnText').textContent = 'Processing…';
    document.getElementById('processBtnIcon').innerHTML = '<span class="spin"></span>';

    const progressWrap = document.getElementById('progressWrap');
    const progressBar  = document.getElementById('progressBar');
    progressWrap.style.display = 'block';
    progressBar.style.width = '0%';

    let done = 0;
    for (let i = 0; i < files.length; i++) {
      if (files[i].status === 'done') { done++; continue; }
      files[i].status = 'processing';
      renderBatch();

      try {
        const fd = new FormData();
        fd.append('file', files[i].file);
        const res = await fetch(`${API}/remove-bg`, { method: 'POST', body: fd });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Server error');
        }
        const data = await res.json();
        files[i].status = 'done';
        files[i].downloadUrl = data.download_url;
        files[i].resultFilename = data.filename;
        addResult(i, data);
      } catch (e) {
        files[i].status = 'error';
        showError(`Failed: ${files[i].name} — ${e.message}`);
      }

      done++;
      progressBar.style.width = `${(done / files.length) * 100}%`;
      renderBatch();
    }

    processing = false;
    document.getElementById('processBtn').disabled = false;
    document.getElementById('processBtnText').textContent = 'Remove Backgrounds';
    document.getElementById('processBtnIcon').innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
    setStatus('online', `Done · Processed ${done} image${done !== 1 ? 's' : ''}`);
  }

  // ── Results ───────────────────────────────────────────────────────────────
  function addResult(i, data) {
    const panel = document.getElementById('resultsPanel');
    const grid  = document.getElementById('resultsGrid');
    panel.style.display = 'block';

    const card = document.createElement('div');
    card.className = 'result-card';
    card.id = `result-${i}`;
    card.innerHTML = `
      <div class="result-preview">
        <img src="${data.download_url}?t=${Date.now()}" alt="Result" loading="lazy">
      </div>
      <div class="result-footer">
        <span class="result-name">${files[i].name.replace(/\.[^.]+$/, '')}.png</span>
        <button class="result-dl" onclick="downloadSingle(${i})">↓ Save</button>
      </div>
    `;
    grid.appendChild(card);
  }

  // ── Download ──────────────────────────────────────────────────────────────
  function downloadSingle(i) {
    const f = files[i];
    if (!f.downloadUrl) return;
    const a = document.createElement('a');
    a.href = `${API}${f.downloadUrl}`;
    a.download = f.name.replace(/\.[^.]+$/, '') + '-transparent.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function downloadAll() {
    files.filter(f => f.downloadUrl).forEach((_, i) => {
      setTimeout(() => downloadSingle(i), i * 300);
    });
  }

  // ── Clear ─────────────────────────────────────────────────────────────────
  function clearAll() {
    if (processing) return;
    files = [];
    document.getElementById('resultsGrid').innerHTML = '';
    document.getElementById('resultsPanel').style.display = 'none';
    document.getElementById('progressWrap').style.display = 'none';
    document.getElementById('progressBar').style.width = '0%';
    hideError();
    renderBatch();
  }

  // ── Error ─────────────────────────────────────────────────────────────────
  function showError(msg) {
    const b = document.getElementById('errorBanner');
    document.getElementById('errorText').textContent = msg;
    b.style.display = 'flex';
  }

  function hideError() {
    document.getElementById('errorBanner').style.display = 'none';
  }
</script>
</body>
</html>
